name: Build Crush 80 ZMK Firmware

on:
  push:
    branches: [main]
    paths:
      - 'zmk/**'
      - 'conf/**'
      - 'patches/**'
      - 'fetch_ble_blob.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable verbose build output'
        type: boolean
        default: false

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest

    container:
      # Official ZMK Docker image — Zephyr SDK + RISC-V toolchain pre-installed
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West init
        run: |
          cd zmk
          west init -l .
          west update
        working-directory: ${{ github.workspace }}

      - name: Apply patches
        run: |
          # ZMK patch: USB_NO_VBUS_DETECT (required for sleep on battery)
          cd zmk-src
          git apply ../zmk/patches/zmk-src/0001-zmk-usb-no-vbus-detect.patch || true
          cd ../modules/hal/hal_telink
          git apply ../../../zmk/patches/hal_telink/0001-exclude-sys-for-BT_HCI_B91.patch || true
          cd ../../../bootloader/mcuboot
          git apply ../../zmk/patches/mcuboot/0001-b91-riscv-boot-fixes.patch || true
        working-directory: ${{ github.workspace }}/zmk

      - name: Fetch Telink BLE blob
        # The BLE blob is proprietary (Telink NDA) but publicly downloadable
        # from the official Telink GitHub repository. It is NOT redistributed
        # here — this step fetches it at build time for personal/dev use.
        run: bash fetch_ble_blob.sh
        working-directory: ${{ github.workspace }}

      - name: Install Python requirements
        run: pip3 install -r zephyr/scripts/requirements.txt
        working-directory: ${{ github.workspace }}/zmk

      - name: Build MCUboot
        run: |
          west build \
            -s bootloader/mcuboot/boot/zephyr \
            -b crush80 \
            -d build-mcuboot \
            -- \
            -DEXTRA_CONF_FILE="$(pwd)/conf/mcuboot.conf" \
            -DDTC_OVERLAY_FILE="$(pwd)/conf/mcuboot.overlay" \
            -DBOARD_ROOT="$(pwd)/zmk"
        working-directory: ${{ github.workspace }}/zmk

      - name: Build OTA bridge
        run: |
          west build \
            -s zmk-src/app \
            -b crush80 \
            -d build-bridge \
            -- \
            -DEXTRA_CONF_FILE="$(pwd)/conf/app.conf;$(pwd)/conf/ota-bridge.conf" \
            -DBOARD_ROOT="$(pwd)/zmk"
        working-directory: ${{ github.workspace }}/zmk

      - name: Build ZMK application
        run: |
          BUILD_FLAGS=""
          if [ "${{ inputs.debug }}" = "true" ]; then
            BUILD_FLAGS="-DCONFIG_LOG_DEFAULT_LEVEL=4"
          fi
          west build \
            -s zmk-src/app \
            -b crush80 \
            -d build \
            -- \
            -DEXTRA_CONF_FILE="$(pwd)/conf/app.conf" \
            -DBOARD_ROOT="$(pwd)/zmk" \
            $BUILD_FLAGS
        working-directory: ${{ github.workspace }}/zmk

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/zephyr/zmk.signed.bin       artifacts/crush80-zmk-app.signed.bin
          cp build/zephyr/zmk.bin              artifacts/crush80-zmk-app.bin
          cp build-bridge/zephyr/zmk.bin       artifacts/crush80-ota-bridge.bin
          cp build-mcuboot/zephyr/zephyr.bin   artifacts/crush80-mcuboot.bin
        working-directory: ${{ github.workspace }}/zmk

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crush80-firmware-${{ github.sha }}
          path: zmk/artifacts/
          retention-days: 30
