description: Per-key backlight scheme for the Crush 80 (RGB build with the per-key engine)

compatible: "crush80,rgb-scheme"

include: base.yaml

properties:
  layer-modes:
    type: array
    required: true
    description: Per layer index. 0 = dark keys, 1 = light keys by what they do, 2 = ignore this layer (marker layers), 3 = ambient wave over the whole board while a USB host is connected, dark keys otherwise.
  layer-side:
    type: array
    required: true
    description: Per layer index, 0xRRGGBB colour of the side bar and logo (0 = dark).
  layer-side-win:
    type: array
    required: true
    description: Same, used while the Windows marker layer is active.
  group-colors:
    type: array
    required: true
    description: 0xRRGGBB per key group, in the order arrow, line, word, page, delete, clip, number, symbol, letter, macro, layer, mod, ctrl, fkey, media, desktop, system, danger.
  mod-combo-colors:
    type: array
    required: true
    description: 15 colours, 0xRRGGBB, for each combination of held modifiers, indexed by mask-1 where Ctrl is 1, Shift 2, Alt 4, Gui 8 (left or right alike). While any modifier is held the whole backlight is dark except the mod bar, which shows this colour.
  mod-bar:
    type: array
    required: true
    description: Matrix positions of the keys that form the mod bar (the top row, positions 0-15 on the Crush 80).
  ambient-colors:
    type: array
    required: false
    description: Two 0xRRGGBB colours the ambient wave (mode 3) runs between. Default cyan and pink.
  ambient-colors-win:
    type: array
    required: false
    description: Same, used while the Windows marker layer is active. Default azure and orchid.
  overrides:
    type: array
    required: true
    description: Triples of layer index, key position and 0xRRGGBB that win over the group colour. Use <255 0 0> for none.
