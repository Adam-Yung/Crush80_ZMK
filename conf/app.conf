# Application configuration for Wobkey Crush 80 (ZMK firmware)
# Applied via: -DEXTRA_CONF_FILE=$(pwd)/conf/app.conf

CONFIG_ZMK_KEYBOARD_NAME="Crush80_ZMK"

# USB -----------------------------------------------------------------------
CONFIG_USB_DC_B91=y
CONFIG_ZMK_USB=y

# Logging -------------------------------------------------------------------
# Logs go to USB CDC-ACM console (shared with mcumgr DFU port).
# B91 USB SRAM = 256B; only one CDC-ACM fits alongside HID.
# ZMK Studio runs over BLE (not USB) for the same reason.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y

# MCUboot DFU ---------------------------------------------------------------
# USB serial (primary) + BLE SMP (backup).
# Flash new firmware: mcumgr --conntype serial --connstring "dev=/dev/ttyACM0,baud=115200" image upload zmk.signed.bin
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=8

# BLE -----------------------------------------------------------------------
# BLE controller: Telink proprietary blob (liblt_9518_zephyr.a, ~2.8 MB).
# 2M PHY disabled — causes LL Response Timeout 0x22 after 40s with this blob.
# BT_PRIVACY disabled — blob doesn't support LE_Set_Random_Address.
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HCI_B91=y
CONFIG_BT_HCI_B91_RX_STACK_SIZE=2048
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=5
CONFIG_ZMK_BLE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# HID indicators
CONFIG_ZMK_HID_INDICATORS=y

# RGB -----------------------------------------------------------------------
# AW20216S LED matrix controller via SPI (pin-shared with matrix columns).
# crush80_led_sync.c handles PE0/PE1/PE2 time-multiplexing between kscan and SPI.
CONFIG_SPI=y
CONFIG_AW20216S=y
CONFIG_ZMK_RGB_UNDERGLOW=n

# Battery ADC ---------------------------------------------------------------
# PD1 = battery voltage through 1/2 divider, ADC channel 0x0A.
CONFIG_BATTERY_B91_ADC=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep Sleep ----------------------------------------------------------------
# Uses DEEPSLEEP_MODE (cold boot on wakeup). Wakes on any keypress.
# 15-minute idle timeout.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# B91 has no USB VBUS-detect — without this, sleep never fires on battery power.
# Provided by patches/zmk-src/0001-zmk-usb-no-vbus-detect.patch.
CONFIG_ZMK_USB_NO_VBUS_DETECT=y

# ZMK Studio ----------------------------------------------------------------
# Live keymap editing via https://zmk.studio over BLE (Chrome/Edge).
# Unlock: Fn+ESC. Do NOT add USB Studio transport (see USB SRAM note above).
CONFIG_ZMK_STUDIO=y
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=64

# Raw flash management (firmware restore via mcumgr) -----------------------
CONFIG_FLASH_MGMT=y

# Boot diagnostics (.noinit SRAM buffer + GPIO heartbeat for debugging) -----
CONFIG_BOOT_DIAG=y

# Retention boot mode (enables Fn+Esc → bootloader) ------------------------
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
