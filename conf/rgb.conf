# Experimental build for the Crush 80 Reboot Pro (RGB).
CONFIG_CRUSH80_RGB=y
CONFIG_ZMK_RGB_UNDERGLOW=y
# The strip driver controls PC2 and PSPI directly.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_SPI=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=25
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25
